<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16130f">
<title>Case Runner – WarEra</title>
<style>
:root{
  --bg:#16130f; --panel:#211c16; --panel2:#2a241c; --line:#3a3127;
  --text:#efe6d8; --muted:#a8998a; --wood:#c98a4b; --wood2:#e0a865;
  --ok:#7fbf6a; --warn:#e2b04a; --bad:#e06a5a; --home:#6aa9e0;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);
  font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
main{max-width:560px;margin:0 auto;padding:16px 16px calc(32px + env(safe-area-inset-bottom))}
header{display:flex;align-items:center;gap:10px;margin:4px 0 14px}
header .logo{width:36px;height:36px;border-radius:8px;background:linear-gradient(135deg,#8a5a2b,#c98a4b);
  display:grid;place-items:center;font-size:20px;box-shadow:inset 0 0 0 2px #6b4420}
header h1{font-size:20px;margin:0;letter-spacing:.2px}
header small{display:block;color:var(--muted);font-size:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.card h2{font-size:13px;text-transform:uppercase;letter-spacing:.8px;color:var(--wood2);margin:0 0 10px}
label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
label:first-of-type{margin-top:0}
input[type=text],input[type=password],input[type=search]{width:100%;padding:11px 12px;border-radius:9px;border:1px solid var(--line);
  background:var(--panel2);color:var(--text);font-size:16px;outline:none}
input:focus{border-color:var(--wood)}
.row{display:flex;gap:8px;align-items:center}
.row>*{flex:1}
button{font:inherit;border:0;border-radius:9px;padding:11px 14px;cursor:pointer;color:var(--text);background:var(--panel2);
  border:1px solid var(--line)}
button.primary{background:var(--wood);color:#1b120a;font-weight:700;border-color:#a86f36;width:100%;padding:14px;font-size:16px}
button.small{padding:7px 10px;font-size:13px;flex:0 0 auto}
button:disabled{opacity:.5}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0 2px}
.toggle span{font-size:14px}
.toggle small{display:block;color:var(--muted);font-size:12px}
.switch{position:relative;width:48px;height:28px;flex:0 0 48px}
.switch input{opacity:0;width:0;height:0}
.switch i{position:absolute;inset:0;border-radius:20px;background:var(--line);transition:.2s}
.switch i:before{content:"";position:absolute;width:22px;height:22px;left:3px;top:3px;border-radius:50%;background:#fff;transition:.2s}
.switch input:checked+i{background:var(--home)}
.switch input:checked+i:before{transform:translateX(20px)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--line);
  border-radius:20px;padding:5px 6px 5px 10px;font-size:13px}
.chip button{padding:0;width:22px;height:22px;border-radius:50%;line-height:20px;font-size:14px;background:transparent;border:0;color:var(--muted)}
.chip.battle{border-color:#7a3a30}
.status{font-size:12.5px;color:var(--muted);margin-top:8px}
.status.ok{color:var(--ok)} .status.warn{color:var(--warn)} .status.bad{color:var(--bad)}
.summary{display:flex;gap:10px;margin-bottom:12px}
.stat{flex:1;background:var(--panel2);border-radius:10px;padding:10px;text-align:center}
.stat b{display:block;font-size:26px;line-height:1.1}
.stat span{font-size:12px;color:var(--muted)}
.stat.best b{color:var(--wood2)}
ol.steps{list-style:none;margin:0;padding:0;counter-reset:s}
ol.steps li{position:relative;padding:10px 0 10px 40px;border-top:1px solid var(--line)}
ol.steps li:first-child{border-top:0}
ol.steps li:before{counter-increment:s;content:counter(s);position:absolute;left:0;top:10px;width:28px;height:28px;border-radius:50%;
  display:grid;place-items:center;font-weight:700;font-size:13px;background:var(--wood);color:#1b120a}
ol.steps li.home:before{background:var(--home)}
ol.steps li.end:before{background:var(--bad);color:#fff}
.step-title{font-weight:600}
.step-sub{font-size:12.5px;color:var(--muted)}
.path{font-size:12px;color:var(--muted);margin-top:4px;word-break:break-word}
.path b{color:var(--text);font-weight:500}
details{margin-top:6px}
summary{cursor:pointer;color:var(--muted);font-size:13px}
.hint{font-size:12px;color:var(--muted);margin-top:6px}
.sugg{background:var(--panel2);border:1px solid var(--line);border-radius:9px;margin-top:4px;max-height:220px;overflow:auto;display:none}
.sugg div{padding:10px 12px;border-top:1px solid var(--line);font-size:14px}
.sugg div:first-child{border-top:0}
.sugg div small{color:var(--muted)}
.picked{margin-top:6px;font-size:13px;color:var(--wood2)}
pre{white-space:pre-wrap;font-size:11px;color:var(--muted);max-height:240px;overflow:auto;background:var(--panel2);padding:8px;border-radius:8px}
</style>
</head>
<body>
<main>
<header>
  <div class="logo">📦</div>
  <div><h1>Case Runner</h1><small>Fewest-moves route for WarEra wooden cases</small></div>
</header>

<section class="card">
  <h2>Positions</h2>
  <label>You are in</label>
  <div class="picker" data-key="start"></div>
  <label>Home region</label>
  <div class="picker" data-key="home"></div>
  <div class="toggle">
    <div><span>Free move home is ready</span><small>Counted as 0 moves, used at the best point in the route</small></div>
    <label class="switch"><input type="checkbox" id="useHome"><i></i></label>
  </div>
  <label>Stamina right now (0–100)</label>
  <input type="text" inputmode="numeric" id="stamina" value="100">
  <label>Finish at (optional)</label>
  <div class="picker" data-key="end"></div>
  <div id="battleChips" class="chips"></div>
</section>

<section class="card">
  <h2>Wooden cases</h2>
  <div id="caseStatus" class="status">Loading map…</div>
  <div id="caseChips" class="chips"></div>
  <label>Add a case region</label>
  <div class="picker" data-key="addCase"></div>
  <div class="row" style="margin-top:8px">
    <button class="small" id="reloadBtn">↻ Reload cases</button>
    <button class="small" id="clearCases">Clear all</button>
  </div>
</section>

<button class="primary" id="goBtn" disabled>Plan route</button>
<div id="result" style="margin-top:12px"></div>

<section class="card">
  <details>
    <summary>Settings &amp; data check</summary>
    <label>WarEra API key (optional, stays on this device)</label>
    <input type="password" id="apiKey" placeholder="Settings → API Tokens in game" autocomplete="off">
    <div class="hint">Stored in this browser only and sent only to api2.warera.io.</div>
    <div class="row" style="margin-top:8px"><button class="small" id="saveKey">Save key</button><button class="small" id="clearKey">Forget key</button></div>
    <details><summary>Region data fields (for debugging)</summary><pre id="debug">—</pre></details>
  </details>
</section>
</main>

<script>
const API = 'https://api2.warera.io/trpc';
const LS = {
  get:(k,d)=>{try{const v=localStorage.getItem('caserun.'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},
  set:(k,v)=>{try{localStorage.setItem('caserun.'+k,JSON.stringify(v))}catch(e){}}
};
const $ = s=>document.querySelector(s);

let regions = {};   // id -> region
let adj = {};       // id -> Set(neighbor ids)
let labels = [];    // [{id,label,search}]
const state = {
  start: LS.get('start',null), home: LS.get('home',null), end: null,
  cases: [], useHome: LS.get('useHome',true)
};

/* ---------- API ---------- */
async function trpc(proc, input){
  const url = API + '/' + proc + (input===undefined?'':'?input='+encodeURIComponent(JSON.stringify(input)));
  const key = LS.get('apiKey','');
  const res = await fetch(url, {headers: key?{'X-API-Key':key}:{}});
  if(!res.ok) throw new Error(proc+' → HTTP '+res.status);
  const j = await res.json();
  const d = j?.result?.data;
  return d && d.json!==undefined ? d.json : d;
}

/* ---------- region helpers ---------- */
const name = id => regions[id] ? regions[id].name : '?';
const label = id => {
  const r = regions[id]; if(!r) return '?';
  return r.name + (r.countryCode?` (${r.countryCode.toUpperCase()})`:'');
};

function buildGraph(list){
  regions = {}; adj = {};
  for(const r of list){ regions[r._id] = r; adj[r._id] = new Set(); }
  for(const r of list) for(const n of (r.neighbors||[])){
    const nid = typeof n==='string'?n:(n?._id||n?.id);
    if(!regions[nid]) continue;
    adj[r._id].add(nid); adj[nid].add(r._id);   // treat links as two-way
  }
  labels = list.map(r=>({id:r._id,label:label(r._id),search:(r.name+' '+(r.countryCode||'')+' '+(r.mainCity||'')).toLowerCase()}))
               .sort((a,b)=>a.label.localeCompare(b.label));
}

/* Look for wooden-case info on region objects (field names aren't documented). */
const CASE_RE = /case|loot|crate|chest|drop/i;
function truthy(v){ if(Array.isArray(v)) return v.length>0; if(v&&typeof v==='object') return Object.keys(v).length>0; return !!v; }
function detectCases(list){
  const hits = {}; // field path -> [ids]
  for(const r of list){
    for(const [k,v] of Object.entries(r)){
      if(CASE_RE.test(k) && truthy(v)) (hits[k] ||= []).push(r._id);
      if(v && typeof v==='object' && !Array.isArray(v)) for(const [k2,v2] of Object.entries(v))
        if(CASE_RE.test(k2) && truthy(v2)) (hits[k+'.'+k2] ||= []).push(r._id);
    }
  }
  // ignore fields present on most regions (static config, not spawns)
  const out = Object.entries(hits).filter(([,ids])=>ids.length < list.length*0.5);
  return out.sort((a,b)=>b[1].length-a[1].length);
}

function debugFields(list){
  const keys = {};
  for(const r of list) for(const [k,v] of Object.entries(r)){
    keys[k] = (keys[k]||0)+1;
    if(v && typeof v==='object' && !Array.isArray(v)) for(const k2 of Object.keys(v)) keys[k+'.'+k2]=(keys[k+'.'+k2]||0)+1;
  }
  return Object.entries(keys).sort().map(([k,c])=>`${k}  ×${c}`).join('\n');
}

/* ---------- loading ---------- */
async function loadMap(){
  $('#caseStatus').className='status'; $('#caseStatus').textContent='Loading map…';
  try{
    let data;
    try{ data = await trpc('region.getRegionsObject'); }
    catch(e){ data = await trpc('region.getAll'); }
    const list = Array.isArray(data) ? data : Object.entries(data).map(([id,r])=>({_id:r._id||id,...r}));
    buildGraph(list);
    $('#debug').textContent = `${list.length} regions\n\n` + debugFields(list);
    const found = detectCases(list);
    if(found.length){
      const [field, ids] = found[0];
      state.cases = [...new Set(ids)];
      setStatus('ok', `${state.cases.length} case${state.cases.length===1?'':'s'} found on the map (field “${field}”). Add or remove any below.`);
    } else {
      state.cases = LS.get('cases',[]).filter(id=>regions[id]);
      setStatus('warn', `Map loaded (${list.length} regions). Add the regions where your cases are waiting (up to 5).`);
    }
    renderBattles(); renderAll();
    $('#goBtn').disabled = false;
  }catch(e){
    setStatus('bad', 'Could not load the map: '+e.message+'. Check your connection or API key, then tap Reload.');
  }
}
function setStatus(cls,txt){ const s=$('#caseStatus'); s.className='status '+cls; s.textContent=txt; }

/* ---------- region pickers ---------- */
function makePicker(el){
  const key = el.dataset.key;
  el.innerHTML = `<input type="search" placeholder="Search region or country code…" autocomplete="off"><div class="sugg"></div><div class="picked"></div>`;
  const inp = el.querySelector('input'), sug = el.querySelector('.sugg');
  const show = ()=>{
    const q = inp.value.trim().toLowerCase();
    if(!q){ sug.style.display='none'; return; }
    const m = labels.filter(l=>l.search.includes(q)).slice(0,12);
    sug.innerHTML = m.map(l=>{
      const r=regions[l.id]; const extra = r.activeBattle?' <small>⚔ battle</small>':'';
      return `<div data-id="${l.id}">${esc(l.label)}${extra}</div>`;
    }).join('') || '<div><small>No match</small></div>';
    sug.style.display='block';
  };
  inp.addEventListener('input',show);
  inp.addEventListener('focus',show);
  sug.addEventListener('click',e=>{
    const d=e.target.closest('[data-id]'); if(!d) return;
    choose(key,d.dataset.id); inp.value=''; sug.style.display='none';
  });
  document.addEventListener('click',e=>{ if(!el.contains(e.target)) sug.style.display='none'; });
}
function choose(key,id){
  if(key==='addCase'){ if(!state.cases.includes(id)) state.cases.push(id); LS.set('cases',state.cases); }
  else { state[key]=id; if(key!=='end') LS.set(key,id); }
  renderAll();
}
function renderAll(){
  for(const el of document.querySelectorAll('.picker')){
    const key=el.dataset.key, p=el.querySelector('.picked'); if(!p||key==='addCase') continue;
    const id=state[key];
    p.innerHTML = id&&regions[id] ? `✓ ${esc(label(id))} ${key==='end'?'<button class="small" id="clrEnd" style="margin-left:6px">✕</button>':''}` : '';
  }
  const ce=$('#clrEnd'); if(ce) ce.onclick=()=>{state.end=null;renderAll();};
  $('#useHome').checked = state.useHome;
  $('#caseChips').innerHTML = state.cases.map(id=>`<span class="chip">📦 ${esc(label(id))}<button data-rm="${id}">✕</button></span>`).join('')
    || '<span class="hint">No cases added yet.</span>';
}
function renderBattles(){
  const b = Object.values(regions).filter(r=>r.activeBattle).slice(0,12);
  $('#battleChips').innerHTML = b.length ? '<span class="hint" style="width:100%">Active battles:</span>' +
    b.map(r=>`<span class="chip battle" data-end="${r._id}" style="cursor:pointer;padding-right:10px">⚔ ${esc(label(r._id))}</span>`).join('') : '';
}
$('#battleChips').addEventListener('click',e=>{const c=e.target.closest('[data-end]'); if(c) choose('end',c.dataset.end);});
$('#caseChips').addEventListener('click',e=>{
  const b=e.target.closest('[data-rm]'); if(!b) return;
  state.cases=state.cases.filter(x=>x!==b.dataset.rm); LS.set('cases',state.cases); renderAll();
});
$('#clearCases').onclick=()=>{state.cases=[];LS.set('cases',[]);renderAll();};
$('#reloadBtn').onclick=loadMap;
$('#useHome').onchange=e=>{state.useHome=e.target.checked;LS.set('useHome',state.useHome);};
$('#apiKey').value = LS.get('apiKey','');
$('#saveKey').onclick=()=>{LS.set('apiKey',$('#apiKey').value.trim()); loadMap();};
$('#clearKey').onclick=()=>{LS.set('apiKey','');$('#apiKey').value='';};

/* ---------- shortest paths ---------- */
function bfs(src){
  const dist={[src]:0}, prev={}, q=[src];
  for(let i=0;i<q.length;i++){ const u=q[i];
    for(const v of adj[u]) if(dist[v]===undefined){ dist[v]=dist[u]+1; prev[v]=u; q.push(v); } }
  return {dist,prev};
}
function pathFrom(tree,src,dst){ const p=[dst]; while(p[0]!==src) p.unshift(tree.prev[p[0]]); return p; }

/* ---------- route solver ---------- */
const INF = 1e9;
function solve(){
  const S=state.start, H=state.useHome?state.home:null, E=state.end;
  let cases=[...new Set(state.cases)].filter(c=>c!==S);
  const trees={}; const tree=id=>trees[id]||(trees[id]=bfs(id));
  const D=(a,b)=>{ const d=tree(a).dist[b]; return d===undefined?INF:d; };
  const dropped = cases.filter(c=>D(S,c)>=INF && (!H || D(H,c)>=INF));
  cases = cases.filter(c=>!dropped.includes(c));
  const n=cases.length;
  const dEnd = c => E ? D(c,E) : 0;
  const homeEnd = H ? (E ? D(H,E) : 0) : INF;

  let order, teleAfter; // teleAfter: index in order after which we jump home (-1 = before first, null = never)
  if(n<=15){
    ({order,teleAfter}=heldKarp(cases,S,H,D,dEnd,homeEnd));
  } else {
    order = improve(greedy(cases,S,D),S,H,D,dEnd);
    teleAfter = evalOrder(order,S,H,D,dEnd).teleAfter;
  }
  const greedyOrder = greedy(cases,S,D);
  const greedyCost = evalOrder(greedyOrder,S,H,D,dEnd).cost;
  return {order,teleAfter,dropped,cost:evalOrder(order,S,H,D,dEnd,teleAfter).cost,greedyCost,tree,D,S,H,E};
}

function greedy(cases,S,D){
  const left=new Set(cases), out=[]; let cur=S;
  while(left.size){ let best=null,bd=INF; for(const c of left){const d=D(cur,c); if(d<bd){bd=d;best=c;}} out.push(best); left.delete(best); cur=best; }
  return out;
}

// Cost of a fixed order, with the free home move placed at the best spot (or the given one).
function evalOrder(order,S,H,D,dEnd,forceTele){
  const seq=[S,...order]; const legs=[];
  for(let i=0;i<order.length;i++) legs.push(D(seq[i],seq[i+1]));
  const endLeg = order.length?dEnd(order[order.length-1]):dEnd(S);
  let base = legs.reduce((a,b)=>a+b,0)+endLeg;
  if(!H) return {cost:base,teleAfter:null};
  // option k: jump home after visiting seq[k] (k=0 means right at start), replacing next leg
  let bestSave=0, at=null;
  const consider=(k)=>{
    let save;
    if(k<order.length) save = legs[k] - D(H,order[k]);
    else { const E2 = order.length?order[order.length-1]:S; save = dEnd(E2) - (state.end?D(H,state.end):0); }
    return save;
  };
  if(forceTele!==undefined){ return {cost: forceTele===null?base:base-consider(forceTele+1), teleAfter:forceTele}; }
  for(let k=0;k<=order.length;k++){ const s=consider(k); if(s>bestSave){bestSave=s;at=k-1;} }
  return {cost:base-bestSave,teleAfter:at};
}

function improve(order,S,H,D,dEnd){
  let best=order.slice(), bc=evalOrder(best,S,H,D,dEnd).cost, better=true;
  while(better){ better=false;
    for(let i=0;i<best.length-1;i++) for(let j=i+1;j<best.length;j++){
      const t=best.slice(0,i).concat(best.slice(i,j+1).reverse(),best.slice(j+1));
      const c=evalOrder(t,S,H,D,dEnd).cost; if(c<bc){best=t;bc=c;better=true;}
    }
  }
  return best;
}

// Exact: DP over subsets. A = free move unused, B = used. Home jump costs 0.
function heldKarp(cases,S,H,D,dEnd,homeEnd){
  const n=cases.length;
  if(n===0){
    const walk = dEnd(S); const viaHome = H?homeEnd:INF;
    return viaHome<walk?{order:[],teleAfter:-1}:{order:[],teleAfter:null};
  }
  const N=1<<n, A=new Float64Array(N*n).fill(INF), B=new Float64Array(N*n).fill(INF);
  const pA=new Int32Array(N*n).fill(-9), pB=new Int32Array(N*n).fill(-9);
  const Hc=new Float64Array(N).fill(INF), pH=new Int32Array(N).fill(-9);
  const d=cases.map(a=>cases.map(b=>D(a,b))), dS=cases.map(c=>D(S,c)), dH=H?cases.map(c=>D(H,c)):null;
  for(let c=0;c<n;c++){ A[(1<<c)*n+c]=dS[c]; pA[(1<<c)*n+c]=-1; }
  if(H){ Hc[0]=0; pH[0]=-1; }
  for(let m=0;m<N;m++){
    if(H){
      for(let c=0;c<n;c++) if(m&(1<<c) && A[m*n+c]<Hc[m]){Hc[m]=A[m*n+c];pH[m]=c;}
      if(Hc[m]<INF) for(let c=0;c<n;c++) if(!(m&(1<<c))){
        const k=(m|1<<c)*n+c, v=Hc[m]+dH[c]; if(v<B[k]){B[k]=v;pB[k]=-2;}
      }
    }
    for(let c=0;c<n;c++){
      const a=A[m*n+c], b=B[m*n+c]; if(a>=INF&&b>=INF) continue;
      for(let x=0;x<n;x++) if(!(m&(1<<x))){
        const k=(m|1<<x)*n+x, dd=d[c][x];
        if(a+dd<A[k]){A[k]=a+dd;pA[k]=c;}
        if(b+dd<B[k]){B[k]=b+dd;pB[k]=c;}
      }
    }
  }
  const F=N-1; let best=INF, last=-1, mode='';
  for(let c=0;c<n;c++){
    const a=A[F*n+c]+dEnd(cases[c]); if(a<best){best=a;last=c;mode='A';}
    if(H){ const ah=A[F*n+c]+homeEnd; if(ah<best){best=ah;last=c;mode='AH';} }
    const b=B[F*n+c]+dEnd(cases[c]); if(b<best){best=b;last=c;mode='B';}
  }
  // reconstruct
  const order=[]; let m=F, c=last, inB=(mode==='B'), teleAfterCase=null;
  if(mode==='AH') teleAfterCase='END';
  while(c>=0){
    order.unshift(c);
    const k=m*n+c;
    if(inB){
      const p=pB[k];
      if(p===-2){ m^=1<<c; const hp=pH[m]; teleAfterCase = hp===-1?'START':hp; c=hp===-1?-1:hp; inB=false; continue; }
      m^=1<<c; c=p;
    } else { const p=pA[k]; m^=1<<c; c=p; }
  }
  const ordIds=order.map(i=>cases[i]);
  let teleAfter=null;
  if(teleAfterCase==='START') teleAfter=-1;
  else if(teleAfterCase==='END') teleAfter=ordIds.length-1;
  else if(teleAfterCase!==null) teleAfter=order.indexOf(teleAfterCase);
  return {order:ordIds,teleAfter};
}

/* ---------- output ---------- */
function plan(){
  const out=$('#result');
  if(!state.start||!regions[state.start]){ out.innerHTML='<div class="card status bad">Pick the region you are in first.</div>'; return; }
  if(state.useHome && !state.home){ out.innerHTML='<div class="card status bad">Pick your home region, or switch off the free move home.</div>'; return; }
  if(!state.cases.length && !state.end){ out.innerHTML='<div class="card status warn">Add at least one case region or a finish point.</div>'; return; }
  const r=solve();
  const steps=[]; let cur=r.S;
  const walk=(to,kind,title)=>{
    const p=pathFrom(r.tree(cur),cur,to); const moves=p.length-1;
    steps.push({kind,title,moves,path:p}); cur=to;
  };
  const jump=()=>{ steps.push({kind:'home',title:'Free move home → '+label(r.H),moves:0}); cur=r.H; };
  if(r.teleAfter===-1) jump();
  r.order.forEach((c,i)=>{
    if(c===cur) steps.push({kind:'case',title:'Collect case in '+label(c),moves:0,path:[c]});
    else walk(c,'case','Collect case in '+label(c));
    if(r.teleAfter===i) jump();
  });
  if(r.E && r.E!==cur) walk(r.E,'end','Arrive at '+label(r.E));
  else if(r.E) steps.push({kind:'end',title:'Arrive at '+label(r.E),moves:0,path:[r.E]});

  // Price each trip: 10 stamina per region, but a trip the bar can't fully cover is charged
  // 2 oil per region and leaves stamina untouched — so split such trips at the stamina limit.
  let sta=Math.max(0,Math.min(100,parseInt($('#stamina').value,10)||0)), staUsed=0, oil=0, splits=0;
  for(const s of steps){
    if(s.kind==='home'||!s.moves) continue;
    const covered=Math.min(Math.floor(sta/10), s.moves);
    if(covered===s.moves){ s.cost=`${s.moves*10} stamina`; }
    else if(covered>0){
      splits++; s.split=true;
      s.cost=`✂ Two trips: ${covered*10} stamina to ${name(s.path[covered])}, then ${2*(s.moves-covered)} oil`;
    } else s.cost=`${2*s.moves} oil`;
    sta-=covered*10; staUsed+=covered*10; oil+=2*(s.moves-covered);
  }
  const total=steps.reduce((a,s)=>a+s.moves,0);
  const saved=r.greedyCost-total;
  out.innerHTML = `
  <section class="card">
    <h2>Best route</h2>
    <div class="summary">
      <div class="stat best"><b>${total}</b><span>moves</span></div>
      <div class="stat"><b>${r.greedyCost}</b><span>nearest-case chain</span></div>
      <div class="stat"><b>${saved>0?'−'+saved:'0'}</b><span>moves saved</span></div>
    </div>
    <div class="status ${oil?'warn':'ok'}">Costs ${staUsed} stamina${oil?` + ${oil} oil`:''}${splits?'. Make the ✂ trips in two goes: one trip longer than your stamina bar is charged entirely in oil.':''}</div>
    ${r.dropped.length?`<div class="status warn">Unreachable, skipped: ${r.dropped.map(label).map(esc).join(', ')}</div>`:''}
    <ol class="steps">${steps.map(s=>`
      <li class="${s.kind==='home'?'home':s.kind==='end'?'end':''}">
        <div class="step-title">${esc(s.title)}</div>
        <div class="step-sub">${s.kind==='home'?'Free – 0 moves':s.moves+' move'+(s.moves===1?'':'s')+(s.cost?' · '+esc(s.cost):'')}</div>
        ${s.path&&s.path.length>2?`<div class="path">via ${s.path.slice(1,-1).map(id=>`<b>${esc(name(id))}</b>`).join(' → ')}</div>`:''}
      </li>`).join('')}
    </ol>
    <div class="hint">Moves = regions crossed. "Nearest-case chain" is what you'd get by always heading to the closest remaining case${state.useHome?' (with the free move home placed as well as possible)':''}.</div>
  </section>`;
  out.scrollIntoView({behavior:'smooth',block:'start'});
}
$('#goBtn').onclick=plan;

function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}

document.querySelectorAll('.picker').forEach(makePicker);
renderAll();
loadMap();
</script>
</body>
